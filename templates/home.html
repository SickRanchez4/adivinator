{% extends "layout.html" %}
{% block body %}
    <section class="card">
        <div class="orb" aria-hidden="true"></div>
        <h1 class="titulo" data-typewriter>Piensa en un personaje… yo lo adivinaré.</h1>
        <p class="subtitulo">
            Ya conozco <span class="contador" data-count="{{ total }}">0</span> personaje{{ 's' if total != 1 }}.
            Si fallo, me lo enseñas y crezco.
        </p>
        <form action="{{ url_for('iniciar') }}" method="post">
            <button type="submit" class="btn">EMPEZAR</button>
        </form>
    </section>
{% endblock %}
