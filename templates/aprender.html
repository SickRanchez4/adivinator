{% extends "layout.html" %}
{% block body %}
    <section class="Adivinator">
        <p class="titulo gana-jugador">¡Tú ganas! Enséñame tu personaje</p>
        <form id="Newanimal" action="{{ url_for('aprender') }}" method="post">
            <div>
                <label for="personaje">¿Cómo se llama el personaje?</label>
                <input type="text" id="personaje" name="personaje" maxlength="60" required autofocus>
            </div>
            <div>
                <label for="pregunta">¿Qué pregunta lo distinguiría de <em>{{ personaje_viejo }}</em>?</label>
                <input type="text" id="pregunta" name="pregunta" maxlength="120"
                       placeholder="¿Tiene plumas?" required>
            </div>
            <fieldset>
                <legend>Para tu personaje, ¿cuál sería la respuesta?</legend>
                <label><input type="radio" name="respuesta_nuevo" value="si" required> Sí</label>
                <label><input type="radio" name="respuesta_nuevo" value="no" required> No</label>
            </fieldset>
            <button type="submit" class="btn">GUARDAR</button>
        </form>
    </section>
{% endblock %}
