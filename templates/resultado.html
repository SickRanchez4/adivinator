{% extends "layout.html" %}
{% block body %}
    <section class="Adivinator">
        {% if gano_maquina %}
            <p class="titulo gana-maquina">¡Qué fácil! Adivinator gana.</p>
            <p class="subtitulo">Era <em>{{ personaje }}</em>.</p>
        {% else %}
            <p class="titulo gana-jugador">¡Aprendido!</p>
            <p class="subtitulo">Ahora <em>{{ personaje }}</em> forma parte del árbol.</p>
        {% endif %}
        <form action="{{ url_for('iniciar') }}" method="post">
            <button type="submit" class="btn">JUGAR DE NUEVO</button>
        </form>
    </section>
{% endblock %}
